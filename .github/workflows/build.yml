name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Smoke test
        shell: pwsh
        run: |
          bin\ip.exe -br a
          bin\ip.exe r
          bin\ss.exe -tlnp
          bin\ifconfig.exe -s

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item bin\*.exe, install.ps1, uninstall.ps1, README.md, LICENSE pkg\
          New-Item -ItemType Directory pkg\bin | Out-Null
          Move-Item pkg\*.exe pkg\bin\
          Compress-Archive -Path pkg\* -DestinationPath net-tools-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: net-tools-windows-x64
          path: net-tools-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: net-tools-windows-x64.zip
